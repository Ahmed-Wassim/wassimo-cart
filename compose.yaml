services:
  cart:
      build: { context: ., dockerfile: Dockerfile.dev }
      volumes:
        - .:/app
        - gocache:/root/.cache/go-build
        - gomod:/go/pkg/mod
      ports: ["9052:8080"]
      env_file: [.env]
      environment:
        - PORT=${PORT}
        - ENV=${ENV}
        # Container-local overrides: same credentials, Docker DNS hostnames.
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
        - CATALOG_SERVICE_URL=http://app:8080
      depends_on: { postgres: { condition: service_healthy } }
      networks: [wassimo-network]

  cart-prod:
      build: { context: ., dockerfile: Dockerfile }
      ports: ["9062:8080"]
      env_file: [.env]
      environment:
        - PORT=8080
        - ENV=dev
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
        - CATALOG_SERVICE_URL=http://app:8080
      depends_on: { postgres: { condition: service_healthy } }
      networks: [wassimo-network]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [cart-pgdata:/var/lib/postgresql]
    ports: ["5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [wassimo-network]

volumes:
  cart-pgdata: {}
  gocache: {}
  gomod: {}
networks: { wassimo-network: { external: true } }
